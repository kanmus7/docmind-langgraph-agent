services:
  - type: web
    name: docmind-api
    runtime: node
    plan: free
    repo: https://github.com/kanmus7/docmind-langgraph-agent
    branch: main
    buildCommand: npm install && npm run build --workspace @docmind/api
    startCommand: npm run start --workspace @docmind/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
